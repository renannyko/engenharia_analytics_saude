# ========================================================================================
# PROJETO: engenharia_analytics_saude
# ARQUIVO: test_snowflake_oidc.yml
# OBJETIVO:
#   Validar a autenticação entre GitHub Actions e Snowflake utilizando
#   Workload Identity Federation (WIF) com OpenID Connect (OIDC).
#
# AMBIENTE:
#   DEV
#
# SEGURANÇA:
#   - autenticação sem senha;
#   - autenticação sem private key;
#   - token OIDC temporário emitido pelo GitHub;
#   - usuário Snowflake dedicado para automação;
#   - role Snowflake dedicada ao CI/CD.
#
# TESTES:
#   - autenticação OIDC;
#   - contexto inicial da sessão;
#   - acesso ao ambiente DEV;
#   - hierarquia ROLE_CICD -> ROLE_ENGENHARIA_ANALYTICS.
#
# OBSERVAÇÃO:
#   Este workflow NÃO realiza deploy.
# ========================================================================================

name: Test Snowflake OIDC

on:
  push:
    branches:
      - feature/implementacao_cd_dev

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  testar_conexao:

    name: Testar conexão Snowflake

    runs-on: ubuntu-latest

    environment: dev

    steps:

      # ----------------------------------------------------------------------------------
      # 1. CHECKOUT
      # ----------------------------------------------------------------------------------

      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ----------------------------------------------------------------------------------
      # 2. CONFIGURAR SNOWFLAKE CLI + OIDC
      # ----------------------------------------------------------------------------------

      - name: Configurar Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: "3.16.0"

      # ----------------------------------------------------------------------------------
      # 3. TESTAR AUTENTICAÇÃO
      # ----------------------------------------------------------------------------------

      - name: Testar autenticação Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: GITHUB_ACTIONS_SERVICE_USER
          SNOWFLAKE_ROLE: ROLE_CICD_ENGENHARIA_ANALYTICS
          SNOWFLAKE_WAREHOUSE: WH_TRANSFORMACAO_DEV
          SNOWFLAKE_DATABASE: ENGENHARIA_ANALYTICS_SAUDE_DEV
        shell: bash
        run: |
          set -e

          echo "Testando autenticação GitHub Actions -> Snowflake..."

          snow connection test -x

      # ----------------------------------------------------------------------------------
      # 4. VALIDAR CONTEXTO INICIAL
      # ----------------------------------------------------------------------------------

      - name: Validar contexto inicial Snowflake
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: GITHUB_ACTIONS_SERVICE_USER
          SNOWFLAKE_ROLE: ROLE_CICD_ENGENHARIA_ANALYTICS
          SNOWFLAKE_WAREHOUSE: WH_TRANSFORMACAO_DEV
          SNOWFLAKE_DATABASE: ENGENHARIA_ANALYTICS_SAUDE_DEV
        shell: bash
        run: |
          set -e

          snow sql -q "
          SELECT
              CURRENT_USER()      AS usuario,
              CURRENT_ROLE()      AS role_atual,
              CURRENT_WAREHOUSE() AS warehouse_atual,
              CURRENT_DATABASE()  AS database_atual;
          " -x

      # ----------------------------------------------------------------------------------
      # 5. VALIDAR ACESSO AO AMBIENTE DEV
      # ----------------------------------------------------------------------------------

      - name: Validar acesso ao ambiente DEV
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: GITHUB_ACTIONS_SERVICE_USER
          SNOWFLAKE_ROLE: ROLE_CICD_ENGENHARIA_ANALYTICS
          SNOWFLAKE_WAREHOUSE: WH_TRANSFORMACAO_DEV
          SNOWFLAKE_DATABASE: ENGENHARIA_ANALYTICS_SAUDE_DEV
        shell: bash
        run: |
          set -e

          snow sql -q "
          SELECT
              COUNT(*) AS qt_schemas
          FROM engenharia_analytics_saude_dev.information_schema.schemata
          WHERE schema_name IN (
              'RAW',
              'STAGING',
              'BUSINESS',
              'INFORMATION',
              'QUALIDADE_DADOS'
          );
          " -x

      # ----------------------------------------------------------------------------------
      # 6. VALIDAR HIERARQUIA DE ROLES
      # ----------------------------------------------------------------------------------

      - name: Validar hierarquia de roles
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: GITHUB_ACTIONS_SERVICE_USER
          SNOWFLAKE_ROLE: ROLE_CICD_ENGENHARIA_ANALYTICS
          SNOWFLAKE_WAREHOUSE: WH_TRANSFORMACAO_DEV
          SNOWFLAKE_DATABASE: ENGENHARIA_ANALYTICS_SAUDE_DEV
        shell: bash
        run: |
          set -e

          echo "Testando ROLE_CICD -> ROLE_ENGENHARIA_ANALYTICS..."

          snow sql -q "
          USE ROLE role_engenharia_analytics;

          SELECT
              CURRENT_USER() AS usuario,
              CURRENT_ROLE() AS role_atual;
          " -x

      # ----------------------------------------------------------------------------------
      # 7. RESULTADO
      # ----------------------------------------------------------------------------------

      - name: Resultado
        shell: bash
        run: |
          echo "============================================================"
          echo "Teste de autenticação concluído com sucesso."
          echo "============================================================"
          echo "Origem: GitHub Actions"
          echo "Destino: Snowflake DEV"
          echo "Método: Workload Identity Federation / OIDC"
          echo "Usuário: GITHUB_ACTIONS_SERVICE_USER"
          echo "Role inicial: ROLE_CICD_ENGENHARIA_ANALYTICS"
          echo "Role de deploy: ROLE_ENGENHARIA_ANALYTICS"
          echo "Warehouse: WH_TRANSFORMACAO_DEV"
          echo "Database: ENGENHARIA_ANALYTICS_SAUDE_DEV"
          echo "Senha: não utilizada"
          echo "Private key: não utilizada"
          echo "============================================================"